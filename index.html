<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubble Gauge — Sleeves PEA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0c0e12; --ink:#e9ecf1; --muted:#838c99; --faint:#5a626e; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
      font-family:"IBM Plex Sans",sans-serif; overflow:hidden; }
    header { position:absolute; top:0; left:0; right:0; z-index:5; padding:22px 28px 0; pointer-events:none; }
    .kicker { font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.26em;
      text-transform:uppercase; color:var(--faint); margin:0 0 4px; }
    h1 { font-family:"Fraunces",serif; font-weight:900; font-size:clamp(24px,3vw,40px);
      margin:0; letter-spacing:-.01em; }
    h1 em { font-style:italic; font-weight:400; color:var(--muted); }
    .tabs { margin-top:16px; display:flex; gap:8px; pointer-events:auto; }
    .tab { font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.04em;
      color:var(--muted); background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
      border-radius:8px; padding:7px 14px; cursor:pointer; transition:.15s; }
    .tab:hover { color:var(--ink); }
    .tab.active { color:#0c0e12; background:var(--ink); border-color:var(--ink); }
    #chart { position:absolute; inset:0; }
    .subtabs { display:none; gap:7px; margin-top:10px; overflow-x:auto; pointer-events:auto; scrollbar-width:none; }
    .subtabs::-webkit-scrollbar { display:none; }
    .chip { flex:none; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted);
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:999px;
      padding:6px 12px; cursor:pointer; display:flex; align-items:center; gap:7px; white-space:nowrap; transition:.15s; }
    .chip .d { width:8px; height:8px; border-radius:50%; }
    .chip:hover { color:var(--ink); }
    .chip.on { color:#0c0e12; background:var(--ink); border-color:var(--ink); font-weight:600; }
    footer { position:absolute; bottom:14px; right:20px; z-index:5;
      font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--faint); }
  </style>
</head>
<body>
  <header>
    <p class="kicker">Dalio bubble gauge · sleeves rotation PEA</p>
    <h1>Dans quel <em>quartier</em> sommes-nous&nbsp;?</h1>
    <div class="tabs">
      <button class="tab active" data-view="map">Carte</button>
      <button class="tab" data-view="radar">Radar</button>
      <button class="tab" data-view="bar">Barres</button>
      <button class="tab" data-view="profils">Profils</button>
    </div>
    <div class="subtabs" id="sleeveSel"></div>
  </header>
  <div id="chart"></div>
  <footer>scores fictifs · éditer src/data.ts</footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
