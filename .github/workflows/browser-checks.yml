name: Browser checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build # tsc && vite build -> dist/index.html (single file)
      - run: npm run check:ci # headless Chromium runs scripts/browser-checks.js
